name: Deploy Infrastructure

on:
  push:
    branches:
      - "**" 

  workflow_dispatch:
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

  TF_VAR_processed_bucket_name: ${{ secrets.PROCESSED_BUCKET_NAME }}
  TF_VAR_db_host: ${{ secrets.DB_HOST }}
  TF_VAR_db_port: ${{ secrets.DB_PORT }}
  TF_VAR_db_name: ${{ secrets.DB_NAME }}
  TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
  TF_VAR_lambda_image_uri: dummy

jobs:
  deploy:

    runs-on: ubuntu-latest
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./lambda
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/qufoods-data-processor:${{ github.sha }}
          provenance: false

      - name: Set image URI
        run: |
          echo "IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/qufoods-data-processor:${{ github.sha }}" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init

        working-directory: terraform

        run: terraform init
      - name: Terraform Validate

        working-directory: terraform

        run: terraform validate
      - name: Terraform Plan

        working-directory: terraform

#        run: terraform plan
        run: terraform plan -var="lambda_image_uri=$IMAGE_URI"
      - name: Terraform Apply

        working-directory: terraform

#        run: terraform apply -auto-approve
        run: terraform apply -auto-approve -var="lambda_image_uri=$IMAGE_URI"
      - name: Check ECR repositories
        run: |
          aws ecr describe-repositories
      - name: Terraform State
        working-directory: terraform
        run: |
          terraform state list
